# The repositories, one entry per system
# Fields:
#   group:          sora | new
#   repo:           GitHub URL
#   commit:         commit SHA (snapshot)
#   source:         folders with the main Java sources
#   exclude:        folders inside source that are left out
#   package_prefix: only classes in this package are kept (if set)
#   doc:            developer document used for ground truth (new only)
#   paper_classes:  number of classes reported in the paper (sora only)
# Always left out: tests, examples/samples, benchmarks.

# --- Sora & Chirila (2019) ---

ant:
  group: sora
  repo: https://github.com/apache/ant
  commit: 026aec5fec7813d0f547ab8c34fdc52935ef4d18   # tag ANT_161
  source: [src/main]
  exclude: []
  paper_classes: 524

hibernate:
  group: sora
  repo: https://github.com/hibernate/hibernate-orm
  commit: 1c915087a1231688c9745336492e24965aaaf1cf   # tag 5.2.12
