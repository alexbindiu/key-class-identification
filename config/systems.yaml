  exclude: [wro4j-examples, wro4j-grails-plugin]
  paper_classes: 336

argouml:
  group: sora
  repo: https://github.com/argouml-tigris-org/argouml
  commit: 68eb73934ac83368169ec9d5d0d7b04dfb4eabef   # last commit before 0.9.5 (2001-10-19)
  source: [src_new]
  exclude: []
  paper_classes: 852

jmeter:
  group: sora
  repo: https://github.com/apache/jmeter
  commit: 1e4c4d9e07608e397b0078c1ff73db05d294b21c   # last commit before 2.0.1 (2004-05-22)
  source: [src]
  exclude: [src/htmlparser]
  paper_classes: 280

